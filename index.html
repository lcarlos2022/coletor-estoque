<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor de Estoque - Grupo Brava</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leitor QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Gerador de Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Gerador de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-12 font-sans">

    <!-- Cabeçalho -->
    <div class="bg-blue-600 text-white p-4 shadow-lg text-center">
        <h1 class="text-xl font-bold">Grupo Brava - Contagem de Estoque</h1>
        <p class="text-xs text-blue-100 mt-1">Mda Construções LTDA</p>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Câmera e Scanner -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 text-center">
            <h2 class="font-semibold text-gray-700 mb-2">Escanear QR Code</h2>
            
            <div id="reader" class="w-full rounded-lg overflow-hidden border bg-black min-h-[260px]"></div>
            
            <div class="flex gap-2 mt-3">
                <button id="btn-iniciar" onclick="iniciarCameraTraseira()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow">
                    🔄 Iniciar Câmera Traseira
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2">Aponte a câmera traseira para o QR Code</p>
        </div>

        <!-- Pop-up/Modal "Quantos?" -->
        <div id="modal-qtd" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Confirmar Contagem</h3>
                <div class="text-left bg-gray-50 p-3 rounded-lg text-sm space-y-1">
                    <p><strong>Código:</strong> <span id="modal-codigo" class="text-blue-600"></span></p>
                    <p><strong>Descrição:</strong> <span id="modal-desc" class="text-gray-700"></span></p>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Quantos?</label>
                    <input type="number" id="input-qtd" value="1" min="1" 
                           class="w-full text-center text-2xl font-bold border-2 border-blue-500 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300">
                </div>

                <div class="flex gap-2">
                    <button onclick="cancelarLeitura()" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold text-sm">Cancelar</button>
                    <button onclick="salvarContagem()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold text-sm">Registrar</button>
                </div>
            </div>
        </div>

        <!-- Lista de Itens Contados e Opções de Envio -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-semibold text-gray-700">Itens Contados (<span id="total-itens">0</span>)</h2>
            </div>
            
            <div class="max-h-52 overflow-y-auto divide-y text-sm" id="lista-produtos">
                <p class="text-gray-400 text-center py-4 text-xs">Nenhum item adicionado ainda.</p>
            </div>

            <!-- Seleção de E-mails -->
            <div class="pt-3 border-t space-y-3">
                <p class="text-xs font-bold text-gray-500 uppercase text-center">Destinatários do Relatório</p>
                
                <div class="bg-gray-50 p-3 rounded-lg space-y-2 text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-gray-700 font-medium">
                        <input type="checkbox" id="chk-corporativo" checked class="w-4 h-4 text-blue-600 rounded">
                        <span>E-mail Corporativo: <strong>luiz.oliveira@brava.com.br</strong></span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-gray-700 font-medium">
                        <input type="checkbox" id="chk-gmail" checked class="w-4 h-4 text-blue-600 rounded">
                        <span>E-mail Privado (Gmail): <strong>ocluiz2021@gmail.com</strong></span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-gray-700 font-medium">
                        <input type="checkbox" id="chk-privado" class="w-4 h-4 text-blue-600 rounded">
                        <span>E-mail Hotmail: <strong>ocluiz@hotmail.com</strong></span>
                    </label>
                </div>

                <!-- Botões Principais de Envio -->
                <div class="space-y-2">
                    <button onclick="enviarEmail()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg text-xs font-bold shadow flex items-center justify-center gap-2">
                        ✉️ Enviar Relatório Direto por E-mail
                    </button>

                    <button onclick="copiarRelatorio()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-xs font-bold shadow flex items-center justify-center gap-2">
                        📋 Copiar Texto do Relatório
                    </button>
                    
                    <button onclick="enviarWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-lg text-xs font-bold shadow flex items-center justify-center gap-2">
                        💬 Enviar pelo WhatsApp
                    </button>
                </div>

                <!-- Botões Secundários (Apenas se quiser salvar cópia local) -->
                <div class="pt-2 border-t text-center">
                    <p class="text-[10px] text-gray-400 uppercase font-semibold mb-2">Baixar Cópias Locais (Opcional)</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="gerarExcel()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-[11px] font-semibold border">
                            📊 Baixar Excel
                        </button>
                        <button onclick="gerarPDF()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-[11px] font-semibold border">
                            📄 Baixar PDF
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        let itensContados = {};
        let html5QrCode = null;
        let itemAtual = null;
        let audioCtx = null;

        const DADOS_EMPRESA = {
            cnpj: "20.948.559/0001-55",
            nome: "Grupo Brava Construcao e Incorporacao",
            razaoSocial: "Mda Construcoes LTDA",
            endereco: "Rua Ary Barroso, nº 70, Sala 1017 - Torre 01 - Papicu",
            municipio: "Fortaleza-CE",
            cep: "60175-705",
            emailCorporativo: "luiz.oliveira@brava.com.br",
            emailGmail: "ocluiz2021@gmail.com",
            emailPrivado: "ocluiz@hotmail.com"
        };

        function inicializarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function tocarBipe() {
            try {
                inicializarAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(2000, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.12);
            } catch (e) {
                console.warn("Aguardando interação para áudio.");
            }
        }

        function processarQRCode(rawText) {
            let codigo = rawText;
            let descricao = "Item sem Descrição";

            try {
                let dados = JSON.parse(rawText);
                codigo = dados.codigo || rawText;
                descricao = dados.descricao || descricao;
            } catch (e) {
                if (rawText.includes(',')) {
                    let partes = rawText.split(',');
                    codigo = partes[0].trim();
                    descricao = partes[1].trim();
                }
            }
            return { codigo, descricao };
        }

        function onScanSuccess(decodedText) {
            if (html5QrCode) {
                html5QrCode.pause();
            }

            tocarBipe();

            itemAtual = processarQRCode(decodedText);

            document.getElementById('modal-codigo').innerText = itemAtual.codigo;
            document.getElementById('modal-desc').innerText = itemAtual.descricao;
            document.getElementById('input-qtd').value = 1;
            
            let modal = document.getElementById('modal-qtd');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => document.getElementById('input-qtd').select(), 100);
        }

        function salvarContagem() {
            let qtdInput = parseInt(document.getElementById('input-qtd').value);
            let qtd = isNaN(qtdInput) || qtdInput < 1 ? 1 : qtdInput;

            if (itensContados[itemAtual.codigo]) {
                itensContados[itemAtual.codigo].quantidade += qtd;
            } else {
                itensContados[itemAtual.codigo] = {
                    descricao: itemAtual.descricao,
                    quantidade: qtd
                };
            }

            atualizarListaInterface();
            fecharModal();
        }

        function cancelarLeitura() {
            fecharModal();
        }

        function fecharModal() {
            let modal = document.getElementById('modal-qtd');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            itemAtual = null;
            if (html5QrCode) {
                html5QrCode.resume();
            }
        }

        function atualizarListaInterface() {
            let container = document.getElementById('lista-produtos');
            let total = 0;
            container.innerHTML = '';

            Object.keys(itensContados).forEach(codigo => {
                let item = itensContados[codigo];
                total += item.quantidade;

                let div = document.createElement('div');
                div.className = 'py-2 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-800">${item.descricao}</p>
                        <p class="text-xs text-gray-500">Cód: ${codigo}</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full text-xs">
                        Qtd: ${item.quantidade}
                    </span>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-itens').innerText = total;
        }

        function gerarTextoRelatorio() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) return null;

            let texto = `RELATÓRIO DE INVENTÁRIO DE ESTOQUE\n`;
            texto += `Empresa: ${DADOS_EMPRESA.nome}\n`;
            texto += `Razão Social: ${DADOS_EMPRESA.razaoSocial}\n`;
            texto += `CNPJ: ${DADOS_EMPRESA.cnpj}\n`;
            texto += `Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
            texto += "-------------------------------------\n\n";
            
            let index = 1;
            chaves.forEach(codigo => {
                let item = itensContados[codigo];
                texto += `${index}. CÓD: ${codigo}\n`;
                texto += `   DESCRIÇÃO: ${item.descricao}\n`;
                texto += `   QUANTIDADE: ${item.quantidade} UN\n\n`;
                index++;
            });

            texto += "-------------------------------------\n";
            texto += `TOTAL DE ITENS CONTADOS: ${document.getElementById('total-itens').innerText}`;
            return texto;
        }

        function copiarRelatorio() {
            let texto = gerarTextoRelatorio();
            if (!texto) {
                alert('Nenhum produto cadastrado para copiar!');
                return;
            }
            navigator.clipboard.writeText(texto).then(() => {
                alert('✅ Relatório copiado para a área de transferência!');
            }).catch(() => {
                alert('Não foi possível copiar automaticamente.');
            });
        }

        function enviarWhatsApp() {
            let texto = gerarTextoRelatorio();
            if (!texto) {
                alert('Nenhum produto cadastrado para enviar!');
                return;
            }
            let url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function enviarEmail() {
            let texto = gerarTextoRelatorio();
            if (!texto) {
                alert('Nenhum produto cadastrado para enviar!');
                return;
            }

            let chkCorporativo = document.getElementById('chk-corporativo').checked;
            let chkGmail = document.getElementById('chk-gmail').checked;
            let chkPrivado = document.getElementById('chk-privado').checked;

            if (!chkCorporativo && !chkGmail && !chkPrivado) {
                alert('Marque pelo menos uma opção de e-mail!');
                return;
            }

            let listaEmails = [];
            if (chkCorporativo) listaEmails.push(DADOS_EMPRESA.emailCorporativo);
            if (chkGmail) listaEmails.push(DADOS_EMPRESA.emailGmail);
            if (chkPrivado) listaEmails.push(DADOS_EMPRESA.emailPrivado);

            let destinatarios = listaEmails.join(',');
            let assunto = encodeURIComponent(`Inventário de Estoque - ${DADOS_EMPRESA.nome}`);
            let corpo = encodeURIComponent(texto);

            window.location.href = `mailto:${destinatarios}?subject=${assunto}&body=${corpo}`;
        }

        function gerarExcel() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) {
                alert('Nenhum produto cadastrado!');
                return;
            }
            let dataHoje = new Date().toLocaleDateString('pt-BR');
            let estruturaExcel = [
                ["CNPJ", DADOS_EMPRESA.cnpj],
                ["Razão Social", DADOS_EMPRESA.razaoSocial],
                ["E-mail", DADOS_EMPRESA.emailGmail],
                ["", ""],
                ["#", "Código", "Descrição", "Quantidade", "Unidade"]
            ];
            let index = 1;
            chaves.forEach(codigo => {
                let item = itensContados[codigo];
                estruturaExcel.push([index, codigo, item.descricao, item.quantidade, "UN"]);
                index++;
            });
            let ws = XLSX.utils.aoa_to_sheet(estruturaExcel);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventário");
            XLSX.writeFile(wb, `Inventario_${dataHoje.replace(/\//g, '-')}.xlsx`);
        }

        function gerarPDF() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) {
                alert('Nenhum produto cadastrado!');
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let dataHoje = new Date().toLocaleDateString('pt-BR');

            doc.setFontSize(14);
            doc.text("RELATÓRIO DE INVENTÁRIO DE ESTOQUE", 14, 15);
            doc.setFontSize(10);
            doc.text(`Empresa: ${DADOS_EMPRESA.nome}`, 14, 23);
            doc.text(`CNPJ: ${DADOS_EMPRESA.cnpj} | Data: ${dataHoje}`, 14, 29);

            let linhas = [];
            let index = 1;
            chaves.forEach(codigo => {
                let item = itensContados[codigo];
                linhas.push([index, codigo, item.descricao, item.quantidade, "UN"]);
                index++;
            });

            doc.autoTable({
                startY: 35,
                head: [['#', 'Código', 'Descrição', 'Qtd', 'Unid']],
                body: linhas
            });

            doc.save(`Inventario_${dataHoje.replace(/\//g, '-')}.pdf`);
        }

        async function iniciarCameraTraseira() {
            inicializarAudio();
            try {
                if (html5QrCode) {
                    try { await html5QrCode.stop(); } catch(e){}
                    await html5QrCode.clear();
                }

                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 220, height: 220 } };
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    let cameraId = devices[0].id;
                    for (let i = 0; i < devices.length; i++) {
                        let label = devices[i].label.toLowerCase();
                        if (label.includes('back') || label.includes('traseira') || label.includes('environment') || label.includes('rear')) {
                            cameraId = devices[i].id;
                            break;
                        }
                    }
                    await html5QrCode.start(cameraId, config, onScanSuccess);
                } else {
                    await html5QrCode.start({ facingMode: { exact: "environment" } }, config, onScanSuccess);
                }
            } catch (err) {
                try {
                    await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess);
                } catch(e) {
                    alert("Verifique as permissões da câmera.");
                }
            }
        }

        document.body.addEventListener('click', () => inicializarAudio(), { once: true });
        window.addEventListener('load', () => { iniciarCameraTraseira(); });
    </script>
</body>
</html>
