<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sienge Scanner Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin: auto; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .icon-box { width: 80px; height: 80px; background-color: #2563eb; color: white; font-size: 36px; display: flex; align-items: center; justify-content: center; border-radius: 20px; margin: 0 auto 20px auto; }
        h1 { font-size: 24px; margin-bottom: 8px; color: #0f172a; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #f8fafc; color: #334155; border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background-color: #f1f5f9; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .scanner-box { background-color: #0f172a; color: white; border-radius: 12px; padding: 20px; text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: space-between; position: relative; margin-top: 10px; }
        .scanner-line { width: 80%; height: 2px; background-color: #ef4444; position: absolute; top: 50%; left: 10%; box-shadow: 0 0 8px #ef4444; }
        .list-item { background: #f8fafc; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; border: 1px solid #e2e8f0; }
        .header-work { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: white; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <div class="container">

        <!-- ================= TELA 1: APRESENTAÇÃO ================= -->
        <div id="view-splash" class="view-section text-center">
            <div class="icon-box">📦</div>
            <h1>Sienge Scanner Pro</h1>
            <p>Controle de Almoxarifado e Coleta Óptica</p>
            
            <button onclick="mudarTela('view-login')" class="btn btn-primary">Entrar no Sistema</button>
            <button onclick="mudarTela('view-register')" class="btn btn-secondary">Criar Novo Cadastro</button>
        </div>

        <!-- ================= TELA 2: CADASTRO ================= -->
        <div id="view-register" class="view-section hidden">
            <div style="display: flex; align-items: center; margin-bottom: 16px;">
                <button onclick="mudarTela('view-splash')" style="background:none; border:none; cursor:pointer; font-size:16px; margin-right:10px;">⬅️</button>
                <h2 style="font-size: 18px;">Criar Cadastro</h2>
            </div>
            <form onsubmit="realizarCadastro(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="reg-senha" required>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar e Continuar</button>
            </form>
        </div>

        <!-- ================= TELA 3: LOGIN ================= -->
        <div id="view-login" class="view-section hidden">
            <div style="display: flex; align-items: center; margin-bottom: 16px;">
                <button onclick="mudarTela('view-splash')" style="background:none; border:none; cursor:pointer; font-size:16px; margin-right:10px;">⬅️</button>
                <h2 style="font-size: 18px;">Acessar Sistema</h2>
            </div>
            <form onsubmit="realizarLogin(event)">
                <div class="form-group">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-senha" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>

        <!-- ================= TELA 4: TRABALHO (LEITOR) ================= -->
        <div id="view-work" class="view-section hidden">
            <div class="header-work">
                <div>
                    <strong id="user-display" style="font-size: 14px; display: block;">Operador</strong>
                    <span style="font-size: 11px; color: #64748b;">Sienge Coleta Ativa</span>
                </div>
                <button onclick="mudarTela('view-splash')" style="background:none; border:none; color: #dc2626; cursor:pointer; font-weight:bold;">Sair</button>
            </div>

            <div class="scanner-box">
                <span style="font-size: 12px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; align-self: center;">Câmera do Leitor</span>
                <div class="scanner-line"></div>
                <div>
                    <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">Aponte para o código de barras</p>
                    <button onclick="simularLeitura()" class="btn btn-primary" style="margin-bottom: 0;">Simular Leitura Óptica</button>
                </div>
            </div>

            <div style="margin-top: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 12px; font-weight: bold; color: #64748b; text-transform: uppercase;">Itens Lidos</span>
                    <span id="contador-itens" style="font-size: 12px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">0 itens</span>
                </div>
                <div id="lista-itens" style="max-height: 120px; overflow-y: auto;">
                    <p style="text-align: center; color: #94a3b8; font-size: 12px; padding: 15px 0;">Nenhum item coletado.</p>
                </div>
            </div>
        </div>

    </main>

    <footer style="font-size: 12px; color: #94a3b8; margin-top: 20px;">
        Sienge Scanner Pro &copy; 2026
    </footer>

    <script>
        let itensColetados = [];

        function mudarTela(idTela) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(idTela).classList.remove('hidden');
        }

        function realizarCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const senha = document.getElementById('reg-senha').value;

            localStorage.setItem('sienge_user_nome', nome);
            localStorage.setItem('sienge_user_email', email);
            localStorage.setItem('sienge_user_senha', senha);

            alert('Cadastro realizado com sucesso!');
            document.getElementById('login-email').value = email;
            mudarTela('view-login');
        }

        function realizarLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value;
            const senhaInput = document.getElementById('login-senha').value;

            const salvoEmail = localStorage.getItem('sienge_user_email');
            const salvoSenha = localStorage.getItem('sienge_user_senha');
            const salvoNome = localStorage.getItem('sienge_user_nome') || 'Operador';

            if ((salvoEmail && emailInput === salvoEmail && senhaInput === salvoSenha) || !salvoEmail) {
                document.getElementById('user-display').innerText = salvoNome;
                mudarTela('view-work');
            } else {
                alert('E-mail ou senha incorretos.');
            }
        }

        function simularLeitura() {
            const codigoExemplo = 'SKU-' + Math.floor(100000 + Math.random() * 900000);
            itensColetados.unshift({ codigo: codigoExemplo, hora: new Date().toLocaleTimeString() });
            
            const container = document.getElementById('lista-itens');
            document.getElementById('contador-itens').innerText = `${itensColetados.length} itens`;
            
            container.innerHTML = itensColetados.map(item => `
                <div class="list-item">
                    <strong>${item.codigo}</strong>
                    <span style="color: #64748b;">${item.hora}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
