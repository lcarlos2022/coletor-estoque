<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor de Estoque - Brava Construções Incorporação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Brava Construções</h1>
                <p class="text-sm text-gray-500">Sistema de Coleta e Inventário</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">CPF</label>
                    <input type="text" id="login-cpf" required placeholder="Digite seu CPF"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="login-senha" required placeholder="••••••••"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 font-medium transition duration-200">
                    Entrar
                </button>
            </form>

            <!-- Botão para cadastrar novo usuário -->
            <div class="mt-4 border-t pt-4 text-center">
                <button onclick="abrirModalCadastro()" 
                    class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
                    + Cadastrar Novo Usuário
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO DE USUÁRIO -->
    <div id="modal-cadastro" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Novo Usuário</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700">CPF</label>
                    <input type="text" id="novo-cpf" placeholder="Somente números ou com pontos"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Senha</label>
                    <input type="password" id="novo-senha" placeholder="Senha de acesso"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div class="flex space-x-2 mt-4">
                    <button onclick="salvarNovoUsuario()" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-700">Salvar</button>
                    <button onclick="fecharModalCadastro()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-400">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO SISTEMA (Oculta inicialmente) -->
    <div id="app-screen" class="hidden min-h-screen p-4 max-w-4xl mx-auto">
        <header class="bg-white p-4 rounded-xl shadow-md flex justify-between items-center mb-4">
            <h1 class="text-lg font-bold text-gray-800">Inventário - Brava</h1>
            <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-600">Sair</button>
        </header>
        <main class="bg-white p-6 rounded-xl shadow-md">
            <p class="text-gray-600">Bem-vindo ao sistema de coleta de estoque!</p>
            <!-- Adicione o restante do seu painel de inventário aqui -->
        </main>
    </div>

    <!-- SCRIPT DE CONTROLE -->
    <script>
        // Inicializar usuários padrão no localStorage se não existirem
        function inicializarUsuarios() {
            let usuarios = JSON.parse(localStorage.getItem('brava_usuarios')) || [];
            // Adiciona o usuário padrão fixo caso não exista
            if (!usuarios.some(u => u.cpf === '265.082.493-04')) {
                usuarios.push({ cpf: '265.082.493-04', senha: 'Penin@54' });
                localStorage.setItem('brava_usuarios', JSON.stringify(usuarios));
            }
        }
        inicializarUsuarios();

        function handleLogin(event) {
            event.preventDefault();
            const cpfInput = document.getElementById('login-cpf').value.trim();
            const senhaInput = document.getElementById('login-senha').value.trim();

            let usuarios = JSON.parse(localStorage.getItem('brava_usuarios')) || [];
            
            // Valida se o CPF e senha conferem com algum usuário cadastrado
            const usuarioValido = usuarios.find(u => u.cpf === cpfInput && u.senha === senhaInput);

            if (usuarioValido) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
            } else {
                alert('CPF ou senha incorreta!');
            }
        }

        function handleLogout() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }

        function abrirModalCadastro() {
            document.getElementById('modal-cadastro').classList.remove('hidden');
        }

        function fecharModalCadastro() {
            document.getElementById('modal-cadastro').classList.add('hidden');
            document.getElementById('novo-cpf').value = '';
            document.getElementById('novo-senha').value = '';
        }

        function salvarNovoUsuario() {
            const cpf = document.getElementById('novo-cpf').value.trim();
            const senha = document.getElementById('novo-senha').value.trim();

            if (!cpf || !senha) {
                alert('Preencha o CPF e a senha!');
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('brava_usuarios')) || [];
            
            if (usuarios.some(u => u.cpf === cpf)) {
                alert('Este CPF já está cadastrado!');
                return;
            }

            usuarios.push({ cpf, senha });
            localStorage.setItem('brava_usuarios', JSON.stringify(usuarios));
            
            alert('Usuário cadastrado com sucesso!');
            fecharModalCadastro();
        }
    </script>
</body>
</html>
