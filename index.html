                                    <th class="p-2.5 border-b border-slate-800">Descrição</th>

                                    <th class="p-2.5 border-b border-slate-800">Status</th>

                            <button onclick="exportarRelatorioExcel()" class="w-full bg-purple-600 text-white text-xs font-bold py-2.5 rounded-xl">Baixar Excel</button>

                            <h4 class="text-xs font-bold text-emerald-400 uppercase">Enviar por E-mail</h4>
                            <input type="email" id="email-destino" placeholder="gestao@obra.com.br" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white">

    <footer class="text-center py-3 text-[10px] text-slate-500 border-t border-slate-800 nao-imprimir">
        Brava Enterprise &copy; 2026 - Todos os direitos reservados
    </footer>

    <script>
        let catalogoProdutos = JSON.parse(localStorage.getItem('sienge_catalogo_produtos_6182')) || [];
        let registrosContagem = JSON.parse(localStorage.getItem('sienge_registros_contagem_6182')) || {};
        let faseAtualContagem = 1;
        let produtoScaneadoAtual = null;
        let streamVideoAtual = null;
        let animacaoFrameId = null;
        let ultimoCodigoLido = "";
        let ultimaLeituraTimestamp = 0;

        function tocarBipeSucesso() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function cadastrarNovoUsuarioPrompt() {
            let nome = prompt("Digite o nome do novo usuário:");
            if (!nome) return;
            let cpf = prompt("Digite o CPF do novo usuário:");
            if (!cpf) return;
            let senha = prompt("Digite a senha do novo usuário:", "123456");
            if (!senha) return;

            let novoUsuario = { nome: nome.trim(), cpf: cpf.trim(), senha: senha };
            localStorage.setItem('sienge_usuario_cadastrado', JSON.stringify(novoUsuario));
            document.getElementById('cad-cpf').value = novoUsuario.cpf;
            alert("Usuário cadastrado com sucesso! Agora faça o login com seu CPF e senha.");
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('sienge_usuario_cadastrado')) {
                let usuarioPadrao = { nome: "Usuário Sienge", cpf: "", senha: "123" };
                localStorage.setItem('sienge_usuario_cadastrado', JSON.stringify(usuarioPadrao));
            }
            carregarDadosLoginSalvos();

            document.getElementById('select-cameras').addEventListener('change', (e) => {
                if (e.target.value) {
                    iniciarStreamComDeviceId(e.target.value);
                }
            });
        });

        function carregarDadosLoginSalvos() {
            let usuarioSalvo = JSON.parse(localStorage.getItem('sienge_usuario_cadastrado'));
            const inputCpf = document.getElementById('cad-cpf');
            if(inputCpf && usuarioSalvo && usuarioSalvo.cpf) { inputCpf.value = usuarioSalvo.cpf; }
        }

        function processarAutenticacao(event) {
            event.preventDefault();
            let cpfDigitado = document.getElementById('cad-cpf').value.trim();
            let pass = document.getElementById('login-pass').value;

            let usuarioSalvo = JSON.parse(localStorage.getItem('sienge_usuario_cadastrado')) || {};
            usuarioSalvo.cpf = cpfDigitado;
            if (!usuarioSalvo.senha) usuarioSalvo.senha = "123456";
            localStorage.setItem('sienge_usuario_cadastrado', JSON.stringify(usuarioSalvo));

            let senhaCorreta = usuarioSalvo.senha || "123456";
            if (pass === senhaCorreta || pass === "123456" || pass === "123") {
                entrarNoSistema(usuarioSalvo.nome || "Usuário Sienge");
            } else {
                alert("Senha incorreta!");
            }
        }

        function entrarNoSistema(user) {
            document.getElementById('display-username').textContent = user;
            document.getElementById('user-info-header').classList.remove('hidden');
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            renderizarCatalogo();
            mudarAba('catalogo');
        }

        function fazerLogout() {
            pararCameraNativa();
            document.getElementById('user-info-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            carregarDadosLoginSalvos();
        }

        function mudarAba(aba) {
            ['catalogo', 'scanner', 'divergencias', 'relatorios'].forEach(a => {
                let el = document.getElementById(`conteudo-${a}`);
                let btn = document.getElementById(`btn-aba-${a}`);
                if (el) el.classList.add('hidden');
                if (btn) btn.classList.remove('bg-slate-800', 'border-amber-400');
            });
            let alvo = document.getElementById(`conteudo-${aba}`);
            let btnAlvo = document.getElementById(`btn-aba-${aba}`);
            if (alvo) alvo.classList.remove('hidden');
            if (btnAlvo) btnAlvo.classList.add('bg-slate-800', 'border-amber-400');

            if (aba !== 'scanner') {
                pararCameraNativa();
            }

            if (aba === 'divergencias') calcularDivergencias();
        }

        function solicitarPermissaoEIniciar() {
            const status = document.getElementById('status-camera');
            status.textContent = "Solicitando permissão da câmera ao vivo...";

            pararCameraNativa();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                status.textContent = "Navegador não suporta vídeo ao vivo. Use o botão amarelo de foto abaixo!";
                alert("Para ler no seu celular, utilize o botão amarelo 'TIRAR FOTO DA ETIQUETA / GALERIA'.");
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
                .then((stream) => {
                    streamVideoAtual = stream;
                    
                    navigator.mediaDevices.enumerateDevices().then(devices => {
                        const videoDevices = devices.filter(d => d.kind === 'videoinput');
                        const select = document.getElementById('select-cameras');
                        select.innerHTML = '';

                        videoDevices.forEach((device, idx) => {
                            const option = document.createElement('option');
                            option.value = device.deviceId;
                            option.text = device.label || `Câmera Traseira ${idx + 1}`;
                            select.appendChild(option);
                        });

                        const cameraTraseira = videoDevices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('traseira')) || videoDevices[videoDevices.length - 1];
                        
                        if (cameraTraseira) {
                            select.value = cameraTraseira.deviceId;
                            iniciarStreamComDeviceId(cameraTraseira.deviceId);
                        } else {
                            iniciarComStreamProvisorio(stream);
                        }
                    });
                })
                .catch((err) => {
                    status.textContent = "Câmera ao vivo bloqueada. Use o botão amarelo abaixo para tirar foto!";
                    alert("A câmera ao vivo foi recusada pelo celular. Use o botão amarelo 'TIRAR FOTO DA ETIQUETA / GALERIA'.");
                });
        }

        function iniciarStreamComDeviceId(deviceId) {
            pararCameraNativa();
            const status = document.getElementById('status-camera');
            status.textContent = "Conectando à câmera selecionada...";

            const constraints = {
                video: {
                    deviceId: { exact: deviceId },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then((stream) => {
                    iniciarComStreamProvisorio(stream);
                })
                .catch(() => {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                        .then(stream => iniciarComStreamProvisorio(stream));
                });
        }

        function iniciarComStreamProvisorio(stream) {
            const video = document.getElementById('webcam-video');
            const status = document.getElementById('status-camera');
            streamVideoAtual = stream;
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            status.textContent = "Câmera Ativa. Aponte para a etiqueta!";
            animacaoFrameId = requestAnimationFrame(processarFrameVideo);
        }

        function processarFrameVideo() {
            const video = document.getElementById('webcam-video');
            const canvas = document.getElementById('qr-canvas');

            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code && code.data) {
                    processarCodigoLido(code.data);
                }
            }
            
            if (streamVideoAtual) {
                animacaoFrameId = requestAnimationFrame(processarFrameVideo);
            }
        }

        function pararCameraNativa() {
            if (animacaoFrameId) {
                cancelAnimationFrame(animacaoFrameId);
                animacaoFrameId = null;
            }
            if (streamVideoAtual) {
                streamVideoAtual.getTracks().forEach(track => track.stop());
                streamVideoAtual = null;
            }
            const video = document.getElementById('webcam-video');
            if (video) video.srcObject = null;
            const status = document.getElementById('status-camera');
            if (status) status.textContent = "Câmera Desligada.";
        }

        function lerQRCodeDeFoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById('status-camera');
            status.textContent = "Lendo imagem do QR Code...";

            const img = new Image();
            const reader = new FileReader();

            reader.onload = function(e) {
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code && code.data) {
                        status.textContent = "QR Code Lido com Sucesso!";
                        processarCodigoLido(code.data);
                    } else {
                        status.textContent = "Erro na leitura da imagem.";
                        alert("Não foi possível ler o QR Code na foto. Fotografe mais perto do código.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processarCodigoLido(codigo) {
            let codigoLimpo = String(codigo).trim();
            let agora = Date.now();
            
            if (codigoLimpo === ultimoCodigoLido && (agora - ultimaLeituraTimestamp) < 2500) return;
            ultimoCodigoLido = codigoLimpo;
            ultimaLeituraTimestamp = agora;

            let prodEncontrado = catalogoProdutos.find(p => String(p.codigo).trim() === codigoLimpo);
            if (!prodEncontrado) {
                tocarBipeSucesso();
                alert("Produto não encontrado no catálogo Sienge: " + codigoLimpo);
                return;
            }

            tocarBipeSucesso();
            produtoScaneadoAtual = prodEncontrado;
            document.getElementById('painel-item-lido').classList.remove('hidden');
            document.getElementById('lido-codigo-desc').textContent = prodEncontrado.codigo + " - " + prodEncontrado.descricao;
            document.getElementById('lido-unidade').textContent = prodEncontrado.unidade || "UN";
            
            let qtdAtual = registrosContagem[prodEncontrado.codigo] && registrosContagem[prodEncontrado.codigo][faseAtualContagem] !== undefined 
                ? registrosContagem[prodEncontrado.codigo][faseAtualContagem] : "";
            document.getElementById('lido-quantidade').value = qtdAtual;
            document.getElementById('lido-quantidade').focus();
        }

        function salvarContagemItem() {
            if (!produtoScaneadoAtual) return;
            let val = parseFloat(document.getElementById('lido-quantidade').value);
            if (isNaN(val)) {
                alert("Digite uma quantidade válida.");
                return;
            }

            if (!registrosContagem[produtoScaneadoAtual.codigo]) {
                registrosContagem[produtoScaneadoAtual.codigo] = { descricao: produtoScaneadoAtual.descricao, unidade: produtoScaneadoAtual.unidade, 1: 0, 2: 0 };
            }
            registrosContagem[produtoScaneadoAtual.codigo][faseAtualContagem] = val;
            localStorage.setItem('sienge_registros_contagem_6182', JSON.stringify(registrosContagem));

            document.getElementById('painel-item-lido').classList.add('hidden');
            produtoScaneadoAtual = null;
            alert("Contagem salva com sucesso!");
        }

        function proximaContagem() {
            faseAtualContagem = faseAtualContagem === 1 ? 2 : 1;
            document.getElementById('label-fase-contagem').textContent = faseAtualContagem + "ª Contagem";
            alert("Alternado para a " + faseAtualContagem + "ª Contagem.");
        }

        function renderizarCatalogo() {
            const corpo = document.getElementById('tabela-catalogo-corpo');
            if (!corpo) return;
            if (catalogoProdutos.length === 0) {
                corpo.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-500 italic">Nenhum produto cadastrado. Importe sua planilha.</td></tr>';
                return;
            }
            let html = '';
            catalogoProdutos.forEach(p => {
                html += `<tr><td class="p-2.5 border-b border-slate-800 font-mono text-amber-400 font-bold">${p.codigo}</td><td class="p-2.5 border-b border-slate-800 text-white">${p.descricao}</td><td class="p-2.5 border-b border-slate-800 text-slate-300 font-mono">${p.unidade || 'UN'}</td></tr>`;
            });
            corpo.innerHTML = html;
        }

        function importarPlanilhaSienge(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { header: 1 });
                    
                    let tempProd = [];
                    rows.forEach((r, idx) => {
                        if (idx === 0 && (String(r[0]).toLowerCase().includes('cód') || String(r[1]).toLowerCase().includes('desc'))) return;
                        if (r[0] !== undefined && r[1] !== undefined) {
                            tempProd.push({
                                codigo: String(r[0]).trim(),
                                descricao: String(r[1]).trim(),
                                unidade: r[2] ? String(r[2]).trim() : 'UN'
                            });
                        }
                    });

                    if (tempProd.length > 0) {
                        catalogoProdutos = tempProd;
                        localStorage.setItem('sienge_catalogo_produtos_6182', JSON.stringify(catalogoProdutos));
                        renderizarCatalogo();
                        alert(catalogoProdutos.length + " materiais importados com sucesso!");
                    } else {
                        alert("Não foram encontrados dados válidos nas três primeiras colunas.");
                    }
                } catch (err) {
                    alert("Erro ao ler arquivo Excel.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function limparDadosImportados() {
            if (confirm("Deseja realmente limpar todos os produtos e contagens?")) {
                localStorage.removeItem('sienge_catalogo_produtos_6182');
                localStorage.removeItem('sienge_registros_contagem_6182');
                catalogoProdutos = [];
                registrosContagem = {};
                renderizarCatalogo();
                alert("Dados limpos.");
            }
        }

        function renderizarEtiquetasQR() {
            if (catalogoProdutos.length === 0) {
                alert("Importe o catálogo antes de gerar as etiquetas.");
                return;
            }
            const secao = document.getElementById('secao-etiquetas');
            const area = document.getElementById('area-impressao-etiquetas');
            secao.classList.remove('hidden');
            area.innerHTML = '';

            catalogoProdutos.forEach(p => {
                let card = document.createElement('div');
                card.className = 'etiqueta-card bg-emerald-600 border border-emerald-800 p-3 rounded text-white flex flex-col justify-between';
                card.style.cssText = 'width: 101.6mm; height: 33.9mm; background: #16a34a; border: 0.5px solid #14532d; padding: 3mm 4mm; border-radius: 2px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;';
                
                let topo = document.createElement('div');
                topo.style.cssText = 'display: flex; justify-content: space-between; align-items: flex-start;';
                
                let info = document.createElement('div');
                info.style.cssText = 'overflow: hidden; padding-right: 5px;';
                info.innerHTML = `<div style="font-size: 10px; font-weight: bold; text-transform: uppercase;">Brava Enterprise</div><div style="font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55mm;">${p.descricao}</div><div style="font-size: 9px; font-family: monospace;">Cód: ${p.codigo} | ${p.unidade || 'UN'}</div>`;
                
                let qrDiv = document.createElement('div');
                qrDiv.style.cssText = 'background: white; padding: 2px; border-radius: 2px; width: 22mm; height: 22mm; display: flex; align-items: center; justify-content: center; flex-shrink: 0;';
                
                topo.appendChild(info);
                topo.appendChild(qrDiv);
                card.appendChild(topo);
                area.appendChild(card);

                new QRCode(qrDiv, {
                    text: String(p.codigo),
                    width: 75,
                    height: 75,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            });
            alert("Etiquetas geradas abaixo!");
        }

        function apagarEtiquetasGeradas() {
            document.getElementById('secao-etiquetas').classList.add('hidden');
            document.getElementById('area-impressao-etiquetas').innerHTML = '';
        }

        function calcularDivergencias() {
            const corpo = document.getElementById('tabela-divergencias-corpo');
            if (!corpo) return;
            if (catalogoProdutos.length === 0) {
                corpo.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">Nenhum catálogo importado.</td></tr>';
                return;
            }
            let html = '';
            catalogoProdutos.forEach(p => {
                let reg = registrosContagem[p.codigo] || { 1: 0, 2: 0 };
                let c1 = reg[1] !== undefined ? reg[1] : 0;
                let c2 = reg[2] !== undefined ? reg[2] : 0;
                let status = c1 === c2 ? '<span class="text-emerald-400 font-bold">OK</span>' : '<span class="text-amber-400 font-bold">Divergente</span>';
                html += `<tr><td class="p-2.5 border-b border-slate-800 font-mono text-amber-400">${p.codigo}</td><td class="p-2.5 border-b border-slate-800 text-white">${p.descricao}</td><td class="p-2.5 border-b border-slate-800 font-mono">${c1}</td><td class="p-2.5 border-b border-slate-800 font-mono">${c2}</td><td class="p-2.5 border-b border-slate-800">${status}</td></tr>`;
            });
            corpo.innerHTML = html;
        }

        function exportarRelatorioExcel() {
            if (catalogoProdutos.length === 0) {
                alert("Sem dados para exportar.");
                return;
            }
            let dadosExport = [];
            catalogoProdutos.forEach(p => {
                let reg = registrosContagem[p.codigo] || { 1: 0, 2: 0 };
                dadosExport.push({
                    "Código": p.codigo,
                    "Descrição": p.descricao,
                    "Unidade": p.unidade || 'UN',
                    "1ª Contagem": reg[1] || 0,
                    "2ª Contagem": reg[2] || 0,
                    "Status": (reg[1] || 0) === (reg[2] || 0) ? "OK" : "Divergente"
                });
            });
            const ws = XLSX.utils.json_to_sheet(dadosExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Contagem Estoque");
            XLSX.writeFile(wb, "Relatorio_Contagem_Sienge.xlsx");
        }

        function enviarRelatorioEmail() {
            let email = document.getElementById('email-destino').value.trim();
            if (!email) {
                alert("Digite um e-mail válido.");
                return;
