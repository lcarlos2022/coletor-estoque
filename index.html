<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas (3,0cm x 1,2cm) | Notas Fiscais</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0ea5e9;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding: 20px;
        }

        .no-print {
            max-width: 900px;
            margin: 0 auto 25px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        h1 span {
            font-size: 0.8rem;
            background: var(--secondary);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: normal;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            background: white;
            color: var(--dark);
            cursor: pointer;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            align-self: flex-end;
        }

        button:hover {
            background-color: #172554;
        }

        /* Folha A4 rigorosamente dimensionada para 1 página com espaço entre etiquetas */
        .sheet {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: white;
            padding: 10mm 10mm;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: repeat(5, 3.0cm);
            grid-auto-rows: 1.2cm;
            gap: 2mm;
            justify-content: center;
            align-content: start;
            overflow: hidden;
        }

        .tag {
            width: 3.0cm;
            height: 1.2cm;
            border-radius: 2px;
            padding: 0.8mm 1mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background-color: #4d6b50 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            overflow: hidden;
            page-break-inside: avoid;
        }

        /* Classes de Molduras */
        .tag.moldura-pontilhada {
            border: 1.2px dashed #2d3e30;
        }
        .tag.moldura-continua {
            border: 1.2px solid #2d3e30;
        }
        .tag.moldura-nenhuma {
            border: none;
        }

        /* Nome da Empresa em Amarelo Vivo */
        .tag-header {
            font-size: 4.8px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            color: #facc15 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 0.3px;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        .tag-body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-grow: 1;
            gap: 3px;
            padding: 0.2mm 0;
        }

        /* Letra Alfabética */
        .tag-letter {
            font-size: 14px;
            font-weight: 900;
            width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            color: white !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .tag-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Textos proporcionais e separados */
        .tag-almox {
            font-size: 5.8px;
            font-weight: 900;
            color: #ffffff !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            text-transform: uppercase;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        .tag-type {
            font-size: 5.8px;
            font-weight: 900;
            color: #e2e8f0 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            text-transform: uppercase;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
            margin-top: 1.5px;
        }

        /* Configuração estrita de Impressão de página única */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: none;
                padding: 0;
            }
            .no-print {
                display: none;
            }
            .sheet {
                box-shadow: none;
                margin: 0;
                padding: 8mm 10mm;
                width: 210mm;
                height: 297mm;
                gap: 2mm;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            .tag {
                background-color: #4d6b50 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .tag.moldura-pontilhada {
                border: 1.2px dashed #2d3e30;
            }
            .tag.moldura-continua {
                border: 1.2px solid #2d3e30;
            }
            .tag.moldura-nenhuma {
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Gerador de Etiquetas <span>3,0cm x 1,2cm (Alfabéticas A-Z)</span></h1>
        <p class="subtitle">Escolha a empresa, o estilo de moldura e imprima suas etiquetas:</p>
        
        <div class="controls">
            <div class="input-group">
                <label for="empresaSelect">Selecione a Empresa:</label>
                <select id="empresaSelect" onchange="atualizarEtiquetas()">
                    <option value="Brava Construção e Incorporação">Brava Construção e Incorporação</option>
                    <option value="Ventos Patrimoniais Ltda">Ventos Patrimoniais Ltda</option>
                </select>
            </div>

            <div class="input-group">
                <label for="molduraSelect">Estilo de Moldura:</label>
                <select id="molduraSelect" onchange="atualizarEtiquetas()">
                    <option value="moldura-pontilhada">Pontilhada (Guia de Corte)</option>
                    <option value="moldura-continua">Linha Contínua (Sólida)</option>
                    <option value="moldura-nenhuma">Sem Moldura</option>
                </select>
            </div>

            <button onclick="window.print()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z"/></svg>
                Imprimir / Salvar PDF
            </button>
        </div>
    </div>

    <!-- Área de Impressão A4 -->
    <div class="sheet" id="etiquetas-container"></div>

    <script>
        const coresAlfabeto = {
            'A': '#dc2626', 'B': '#ea580c', 'C': '#d97706', 'D': '#ca8a04',
            'E': '#65a30d', 'F': '#16a34a', 'G': '#059669', 'H': '#0d9488',
            'I': '#0891b2', 'J': '#0284c7', 'K': '#2563eb', 'L': '#4f46e5',
            'M': '#7c3aed', 'N': '#9333ea', 'O': '#c026d3', 'P': '#db2777',
            'Q': '#e11d48', 'R': '#57534e', 'S': '#334155', 'T': '#0f172a',
            'U': '#09090b', 'V': '#312e81', 'W': '#374151', 'X': '#0284c7',
            'Y': '#0f766e', 'Z': '#166534'
        };

        function atualizarEtiquetas() {
            const empresaNome = document.getElementById('empresaSelect').value;
            const molduraClasse = document.getElementById('molduraSelect').value;
            const container = document.getElementById('etiquetas-container');
            container.innerHTML = '';

            for (let i = 65; i <= 90; i++) {
                const letra = String.fromCharCode(i);
                const cor = coresAlfabeto[letra] || '#1e3a8a';

                const tag = document.createElement('div');
                tag.className = `tag ${molduraClasse}`;
                tag.innerHTML = `
                    <div class="tag-header">${empresaNome}</div>
                    <div class="tag-body">
                        <div class="tag-letter" style="background-color: ${cor};">${letra}</div>
                        <div class="tag-info">
                            <span class="tag-almox">ALMOXARIFADO</span>
                            <span class="tag-type">NOTA FISCAL</span>
                        </div>
                    </div>
                `;
                container.appendChild(tag);
            }
        }

        window.onload = () => atualizarEtiquetas();
    </script>
</body>
</html>
