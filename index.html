<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS / Inventário - Almoxarifado Brava</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Bibliotecas auxiliares (html5-qrcode, SheetJS, EmailJS) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- TELA DE LOGIN / CADASTRO EXCLUSIVO -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700">
            <h2 id="tituloTelaAuth" class="text-2xl font-bold text-center text-yellow-400 mb-6">Almoxarifado Brava - Acesso</h2>
            
            <form id="formAcesso" onsubmit="processarAcesso(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Seu E-mail</label>
                    <input type="email" id="emailInput" required 
                        class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md focus:outline-none focus:border-yellow-400 text-white"
                        placeholder="seu.email@empresa.com">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Sua Senha (6 a 8 dígitos, 1 Maiúscula, Números, 1 Especial)</label>
                    <input type="password" id="senhaInput" required 
                        class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md focus:outline-none focus:border-yellow-400 text-white"
                        placeholder="Ex: Brava@1">
                </div>

                <div id="mensagemAlerta" class="text-sm text-red-400 hidden p-2 bg-red-900/30 rounded border border-red-700"></div>

                <button type="submit" id="btnSubmitTexto"
                    class="w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold rounded-md transition duration-200">
                    Entrar no Sistema
                </button>

                <!-- Botão visível de redefinição para limpar qualquer dado travado -->
                <button type="button" onclick="forcarResetAcesso()" 
                    class="w-full py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded transition duration-200 mt-2">
                    ⚠️ Limpar Senha e Cadastrar Nova
                </button>
            </form>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL (Catálogo, Scanner QR Code, Padrão Pimaco) -->
    <div id="app-screen" class="hidden flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">
        <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700">
            <h1 class="text-xl font-bold text-yellow-400">WMS - Painel de Controle</h1>
            <button onclick="sairDoApp()" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-bold">Sair</button>
        </header>

        <!-- Seção de Scanner e Catálogo -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <h3 class="font-bold text-lg mb-2 text-yellow-400">Leitor de QR Code / Bipagem</h3>
                <div id="reader" class="w-full bg-gray-900 rounded mb-2"></div>
                <p id="resultadoBip" class="text-sm text-green-400">Aguardando leitura...</p>
            </div>

            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="font-bold text-lg mb-2 text-yellow-400">Catálogo de Produtos Bipados</h3>
                    <ul id="listaCatalogo" class="space-y-2 text-sm max-h-48 overflow-y-auto pr-2">
                        <li class="text-gray-400 italic">Nenhum item bipado ainda.</li>
                    </ul>
                </div>
                <button onclick="gerarEtiquetaPimaco()" class="mt-4 w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold rounded">
                    Gerar Etiqueta Padrão Pimaco
                </button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            verificarEstadoInicial();
        };

        function verificarEstadoInicial() {
            const emailSalvo = localStorage.getItem('wms_dono_email');
            if (emailSalvo) {
                document.getElementById('tituloTelaAuth').textContent = "Almoxarifado Brava - Restrito";
                document.getElementById('btnSubmitTexto').textContent = "Entrar";
            } else {
                document.getElementById('tituloTelaAuth').textContent = "Almoxarifado Brava - Primeiro Registro";
                document.getElementById('btnSubmitTexto').textContent = "Cadastrar Acesso";
            }
        }

        function processarAcesso(event) {
            event.preventDefault();

            const emailDigitado = document.getElementById('emailInput').value.trim().toLowerCase();
            const senhaDigitada = document.getElementById('senhaInput').value;
            const divAlerta = document.getElementById('mensagemAlerta');

            divAlerta.classList.add('hidden');
            divAlerta.textContent = '';

            // Regra da Senha: 6 a 8 dígitos, 1 maiúscula, números, 1 especial
            const temTamanhoValido = senhaDigitada.length >= 6 && senhaDigitada.length <= 8;
            const temMaiuscula = /[A-Z]/.test(senhaDigitada);
            const temNumero = /[0-9]/.test(senhaDigitada);
            const temEspecial = /[^A-Za-z0-9]/.test(senhaDigitada);

            if (!temTamanhoValido || !temMaiuscula || !temNumero || !temEspecial) {
                divAlerta.textContent = "A senha deve ter de 6 a 8 caracteres, contendo 1 letra maiúscula, números e 1 caractere especial (Ex: Brava@1).";
                divAlerta.classList.remove('hidden');
                return;
            }

            let emailSalvo = localStorage.getItem('wms_dono_email');
            let senhaSalva = localStorage.getItem('wms_dono_senha');

            // Se não existe cadastro, registra o seu e-mail e senha como os oficiais
            if (!emailSalvo) {
                localStorage.setItem('wms_dono_email', emailDigitado);
                localStorage.setItem('wms_dono_senha', senhaDigitada);
                alert("Acesso cadastrado e protegido com sucesso!");
                entrarNoPainel();
                return;
            }

            // Se já existe, confere se bate com o salvo
            if (emailDigitado !== emailSalvo || senhaDigitada !== senhaSalva) {
                divAlerta.textContent = "E-mail ou senha incorretos! Acesso negado.";
                divAlerta.classList.remove('hidden');
                return;
            }

            entrarNoPainel();
        }

        function entrarNoPainel() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        function sairDoApp() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('formAcesso').reset();
            verificarEstadoInicial();
        }

        function forcarResetAcesso() {
            localStorage.removeItem('wms_dono_email');
            localStorage.removeItem('wms_dono_senha');
            document.getElementById('emailInput').value = '';
            document.getElementById('senhaInput').value = '';
            verificarEstadoInicial();
            alert("Memória limpa! Agora digite seu e-mail e sua nova senha e clique em 'Cadastrar Acesso'.");
        }

        function gerarEtiquetaPimaco() {
            alert("Módulo de etiquetas Pimaco acionado com sucesso com base nos dados do catálogo!");
        }
    </script>
</body>
</html>
