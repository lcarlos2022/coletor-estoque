<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS / Inventário - Almoxarifado Brava</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Bibliotecas auxiliares (html5-qrcode, SheetJS, EmailJS) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- CABEÇALHO / TELA DE LOGIN / CADASTRO -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700">
            <h2 id="tituloAuth" class="text-2xl font-bold text-center text-yellow-400 mb-6">Almoxarifado Brava - Acesso</h2>
            
            <form id="formAcesso" onsubmit="validarLoginOuCadastro(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">E-mail de Acesso</label>
                    <input type="email" id="emailInput" required 
                        class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md focus:outline-none focus:border-yellow-400 text-white"
                        placeholder="seu.email@empresa.com">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Senha (6 a 8 dígitos, 1 Maiúscula, Números, 1 Especial)</label>
                    <input type="password" id="senhaInput" required 
                        class="w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md focus:outline-none focus:border-yellow-400 text-white"
                        placeholder="Ex: Brava@1">
                </div>

                <div id="mensagemAlerta" class="text-sm text-red-400 hidden"></div>

                <button type="submit" id="btnAcao"
                    class="w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold rounded-md transition duration-200">
                    Entrar / Cadastrar
                </button>

                <!-- Botão de emergência caso queira trocar/limpar o e-mail gravado -->
                <button type="button" onclick="limparCadastroSistema()" 
                    class="w-full py-1 bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs rounded transition duration-200">
                    🔄 Redefinir E-mail Cadastrado
                </button>
            </form>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL (Catálogo, Scanner QR Code, Padrão Pimaco) -->
    <div id="app-screen" class="hidden flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">
        <header class="flex justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700">
            <h1 class="text-xl font-bold text-yellow-400">WMS - Painel de Controle</h1>
            <button onclick="sairDoApp()" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-bold">Sair</button>
        </header>

        <!-- Seção de Scanner e Catálogo -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <h3 class="font-bold text-lg mb-2 text-yellow-400">Leitor de QR Code / Bipagem</h3>
                <div id="reader" class="w-full bg-gray-900 rounded mb-2"></div>
                <p id="resultadoBip" class="text-sm text-green-400">Aguardando leitura...</p>
            </div>

            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 flex flex-col justify-between">
                <div>
                    <h3 class="font-bold text-lg mb-2 text-yellow-400">Catálogo de Produtos Bipados</h3>
                    <ul id="listaCatalogo" class="space-y-2 text-sm max-h-48 overflow-y-auto pr-2">
                        <li class="text-gray-400 italic">Nenhum item bipado ainda.</li>
                    </ul>
                </div>
                <button onclick="gerarEtiquetaPimaco()" class="mt-4 w-full py-2 bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold rounded">
                    Gerar Etiqueta Padrão Pimaco
                </button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            verificarStatusCadastro();
        };

        function verificarStatusCadastro() {
            const emailSalvo = localStorage.getItem('wms_email_cadastrado');
            if (emailSalvo) {
                document.getElementById('tituloAuth').textContent = "Almoxarifado Brava - Login";
                document.getElementById('btnAcao').textContent = "Entrar";
            } else {
                document.getElementById('tituloAuth').textContent = "Almoxarifado Brava - Cadastro";
                document.getElementById('btnAcao').textContent = "Cadastrar e Entrar";
            }
        }

        function validarLoginOuCadastro(event) {
            event.preventDefault();

            const emailDigitado = document.getElementById('emailInput').value.trim().toLowerCase();
            const senhaDigitada = document.getElementById('senhaInput').value;
            const divAlerta = document.getElementById('mensagemAlerta');

            divAlerta.classList.add('hidden');
            divAlerta.textContent = '';

            let emailSalvo = localStorage.getItem('wms_email_cadastrado');

            // Se não houver e-mail cadastrado, grava automaticamente o que o usuário digitou
            if (!emailSalvo) {
                localStorage.setItem('wms_email_cadastrado', emailDigitado);
                emailSalvo = emailDigitado;
            }

            // Validação de E-mail
            if (emailDigitado !== emailSalvo) {
                divAlerta.textContent = "Atenção: E-mail não confere com o cadastrado. Clique em 'Redefinir E-mail Cadastrado' abaixo se mudou de e-mail.";
                divAlerta.classList.remove('hidden');
                return;
            }

            // Regra rigorosa da Senha (6 a 8 dígitos, 1 maiúscula, números, 1 especial)
            const regexSenha = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>_-])[A-Za-z\d!@#$%^&*(),.?":{}|<>_-]{6,8}$/;

            if (!regexSenha.test(senhaDigitada)) {
                divAlerta.textContent = "A senha deve ter de 6 a 8 dígitos, contendo pelo menos uma letra maiúscula, números e um caractere especial.";
                divAlerta.classList.remove('hidden');
                return;
            }

            // Sucesso
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
        }

        function limparCadastroSistema() {
            localStorage.removeItem('wms_email_cadastrado');
            document.getElementById('emailInput').value = '';
            document.getElementById('senhaInput').value = '';
            verificarStatusCadastro();
            alert("E-mail anterior apagado! Agora você pode digitar e cadastrar o seu e-mail novo.");
        }

        function sairDoApp() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('formAcesso').reset();
        }

        function gerarEtiquetaPimaco() {
            alert("Módulo de etiquetas Pimaco acionado com sucesso com base nos dados do catálogo!");
        }
    </script>
</body>
</html>
