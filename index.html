<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor de Estoque - QR Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-12 font-sans">

    <div class="bg-blue-600 text-white p-4 shadow-lg text-center">
        <h1 class="text-xl font-bold">Contagem de Estoque</h1>
        <p id="data-inicio" class="text-xs text-blue-100 mt-1"></p>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 text-center">
            <h2 class="font-semibold text-gray-700 mb-2">Escanear QR Code</h2>
            
            <div id="reader" class="w-full rounded-lg overflow-hidden border bg-black min-h-[260px]"></div>
            
            <div class="flex gap-2 mt-3">
                <button id="btn-iniciar" onclick="iniciarCameraTraseira()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow">
                    🔄 Iniciar Câmera Traseira
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-2">Aponte a câmera traseira para o QR Code</p>
        </div>

        <!-- Pop-up/Modal "Quantos?" -->
        <div id="modal-qtd" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Confirmar Contagem</h3>
                <div class="text-left bg-gray-50 p-3 rounded-lg text-sm space-y-1">
                    <p><strong>Código:</strong> <span id="modal-codigo" class="text-blue-600"></span></p>
                    <p><strong>Descrição:</strong> <span id="modal-desc" class="text-gray-700"></span></p>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Quantos?</label>
                    <input type="number" id="input-qtd" value="1" min="1" 
                           class="w-full text-center text-2xl font-bold border-2 border-blue-500 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-300">
                </div>

                <div class="flex gap-2">
                    <button onclick="cancelarLeitura()" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold text-sm">Cancelar</button>
                    <button onclick="salvarContagem()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold text-sm">Registrar</button>
                </div>
            </div>
        </div>

        <!-- Lista de Itens Contados -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-semibold text-gray-700">Itens Contados (<span id="total-itens">0</span>)</h2>
                <button onclick="gerarExcel()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                    📊 Exportar Excel
                </button>
            </div>
            
            <div class="max-h-60 overflow-y-auto divide-y text-sm" id="lista-produtos">
                <p class="text-gray-400 text-center py-4 text-xs">Nenhum item adicionado ainda.</p>
            </div>
        </div>

    </div>

    <script>
        let dataInicio = new Date();
        let itensContados = {};
        let html5QrCode = null;
        let itemAtual = null;

        function formatarData(data) {
            return data.toLocaleDateString('pt-BR') + ' ' + data.toLocaleTimeString('pt-BR');
        }

        document.getElementById('data-inicio').innerText = 'Início: ' + formatarData(dataInicio);

        function processarQRCode(rawText) {
            let codigo = rawText;
            let descricao = "Item sem Descrição";

            try {
                let dados = JSON.parse(rawText);
                codigo = dados.codigo || rawText;
                descricao = dados.descricao || descricao;
            } catch (e) {
                if (rawText.includes(',')) {
                    let partes = rawText.split(',');
                    codigo = partes[0].trim();
                    descricao = partes[1].trim();
                }
            }
            return { codigo, descricao };
        }

        function onScanSuccess(decodedText) {
            if (html5QrCode) {
                html5QrCode.pause();
            }
            itemAtual = processarQRCode(decodedText);

            document.getElementById('modal-codigo').innerText = itemAtual.codigo;
            document.getElementById('modal-desc').innerText = itemAtual.descricao;
            document.getElementById('input-qtd').value = 1;
            
            let modal = document.getElementById('modal-qtd');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            setTimeout(() => document.getElementById('input-qtd').select(), 100);
        }

        function salvarContagem() {
            let qtdInput = parseInt(document.getElementById('input-qtd').value);
            let qtd = isNaN(qtdInput) || qtdInput < 1 ? 1 : qtdInput;

            if (itensContados[itemAtual.codigo]) {
                itensContados[itemAtual.codigo].quantidade += qtd;
            } else {
                itensContados[itemAtual.codigo] = {
                    descricao: itemAtual.descricao,
                    quantidade: qtd
                };
            }

            atualizarListaInterface();
            fecharModal();
        }

        function cancelarLeitura() {
            fecharModal();
        }

        function fecharModal() {
            let modal = document.getElementById('modal-qtd');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            itemAtual = null;
            if (html5QrCode) {
                html5QrCode.resume();
            }
        }

        function atualizarListaInterface() {
            let container = document.getElementById('lista-produtos');
            let total = 0;
            container.innerHTML = '';

            Object.keys(itensContados).forEach(codigo => {
                let item = itensContados[codigo];
                total += item.quantidade;

                let div = document.createElement('div');
                div.className = 'py-2 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-800">${item.descricao}</p>
                        <p class="text-xs text-gray-500">Cód: ${codigo}</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full text-xs">
                        Qtd: ${item.quantidade}
                    </span>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-itens').innerText = total;
        }

        function gerarExcel() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) {
                alert('Nenhum produto para exportar!');
                return;
            }

            let horaFinal = new Date();
            let dadosExcel = [];

            chaves.forEach(codigo => {
                dadosExcel.push({
                    "Data de Início": formatarData(dataInicio),
                    "Código do Produto": codigo,
                    "Descrição": itensContados[codigo].descricao,
                    "Quantidade": itensContados[codigo].quantidade,
                    "Hora Final": formatarData(horaFinal)
                });
            });

            let ws = XLSX.utils.json_to_sheet(dadosExcel);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventario");

            XLSX.writeFile(wb, `Relatorio_Estoque_${horaFinal.toISOString().slice(0,10)}.xlsx`);
        }

        async function iniciarCameraTraseira() {
            try {
                if (html5QrCode) {
                    try { await html5QrCode.stop(); } catch(e){}
                    await html5QrCode.clear();
                }

                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 220, height: 220 } };

                // Busca a lista física de lentes/câmeras do dispositivo
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    // Tenta encontrar a câmera que contenha nomes indicando a traseira
                    let cameraId = devices[0].id; // Padrão
                    
                    for (let i = 0; i < devices.length; i++) {
                        let label = devices[i].label.toLowerCase();
                        if (label.includes('back') || label.includes('traseira') || label.includes('environment') || label.includes('rear') || label.includes('0, facing back')) {
                            cameraId = devices[i].id;
                            break;
                        }
                    }
                    
                    // Se não achou pelo nome, pega a última câmera registrada (geralmente é a traseira em celulares)
                    if (cameraId === devices[0].id && devices.length > 1) {
                        cameraId = devices[devices.length - 1].id;
                    }

                    await html5QrCode.start(cameraId, config, onScanSuccess);
                } else {
                    // Se não listou os aparelhos, tenta a restrição padrão do sistema
                    await html5QrCode.start({ facingMode: { exact: "environment" } }, config, onScanSuccess);
                }
            } catch (err) {
                console.warn("Tentando modo fallback de câmera traseira...", err);
                try {
                    await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScanSuccess);
                } catch(e) {
                    alert("Por favor, verifique as permissões da câmera no seu navegador.");
                }
            }
        }

        window.addEventListener('load', () => {
            iniciarCameraTraseira();
        });
    </script>
</body>
</html>
