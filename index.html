<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor de Estoque - Grupo Brava</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leitor QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-12 font-sans">

    <!-- Cabeçalho -->
    <div class="bg-blue-600 text-white p-4 shadow-lg text-center">
        <h1 class="text-xl font-bold">Grupo Brava - Contagem de Estoque</h1>
        <p class="text-xs text-blue-100 mt-1">Mda Construções LTDA</p>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Câmera e Scanner -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 text-center">
            <h2 class="font-semibold text-gray-700 mb-2">Escanear QR Code</h2>
            <div id="reader" class="w-full rounded-lg overflow-hidden border bg-black min-h-[260px]"></div>
            <div class="flex gap-2 mt-3">
                <button id="btn-iniciar" onclick="iniciarCameraTraseira()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow">
                    🔄 Iniciar Câmera Traseira
                </button>
            </div>
        </div>

        <!-- Modal Quantidade -->
        <div id="modal-qtd" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Confirmar Contagem</h3>
                <div class="text-left bg-gray-50 p-3 rounded-lg text-sm space-y-1">
                    <p><strong>Código:</strong> <span id="modal-codigo" class="text-blue-600"></span></p>
                    <p><strong>Descrição:</strong> <span id="modal-desc" class="text-gray-700"></span></p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Quantidade / Contagem</label>
                    <input type="number" id="input-qtd" value="1" min="0" step="any" class="w-full text-center text-2xl font-bold border-2 border-blue-500 rounded-lg p-2 focus:outline-none">
                </div>
                <div class="flex gap-2">
                    <button onclick="cancelarLeitura()" class="w-1/2 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold text-sm">Cancelar</button>
                    <button onclick="salvarContagem()" class="w-1/2 bg-blue-600 text-white py-3 rounded-lg font-semibold text-sm">Registrar</button>
                </div>
            </div>
        </div>

        <!-- Lista e Ações de Envio -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-semibold text-gray-700">Itens Contados (<span id="total-itens">0</span>)</h2>
            </div>
            
            <div class="max-h-52 overflow-y-auto divide-y text-sm" id="lista-produtos">
                <p class="text-gray-400 text-center py-4 text-xs">Nenhum item adicionado ainda.</p>
            </div>

            <!-- Destinatários de E-mail Editáveis -->
            <div class="pt-3 border-t space-y-3">
                <p class="text-xs font-bold text-gray-500 uppercase">Enviar Relatório Para:</p>
                
                <div class="bg-gray-50 p-3 rounded-lg space-y-3 border border-gray-200">
                    
                    <!-- E-mail 1 -->
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <input type="checkbox" id="chk-corp" checked class="w-4 h-4 text-blue-600 rounded">
                            <label for="chk-corp" class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">E-mail Corporativo</label>
                        </div>
                        <input type="email" id="email-corp" value="luiz.oliveira@brava.com.br" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium text-gray-800">
                    </div>

                    <hr class="border-gray-200">

                    <!-- E-mail 2 -->
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <input type="checkbox" id="chk-celular" checked class="w-4 h-4 text-blue-600 rounded">
                            <label for="chk-celular" class="text-[10px] font-bold text-green-600 uppercase tracking-wider">E-mail Celular (Gmail)</label>
                        </div>
                        <input type="email" id="email-celular" value="ocluiz2021@gmail.com" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium text-gray-800">
                    </div>

                    <hr class="border-gray-200">

                    <!-- E-mail 3 -->
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <input type="checkbox" id="chk-pc" checked class="w-4 h-4 text-blue-600 rounded">
                            <label for="chk-pc" class="text-[10px] font-bold text-purple-600 uppercase tracking-wider">E-mail PC / Notebook (Hotmail)</label>
                        </div>
                        <input type="email" id="email-pc" value="ocluiz@hotmail.com" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium text-gray-800">
                    </div>

                </div>

                <!-- Campo para E-mail Adicional -->
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Outro e-mail adicional (opcional):</label>
                    <input type="email" id="input-outro-email" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="exemplo@email.com">
                </div>

                <!-- Botões de Ação -->
                <div class="space-y-2">
                    <button id="btn-envio" onclick="enviarRelatorioServidor()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg text-xs font-bold shadow flex items-center justify-center gap-2">
                        📊 Enviar Relatório em Formato Excel (E-mail)
                    </button>
                    <button onclick="baixarExcelLocal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow flex items-center justify-center gap-2">
                        📥 Baixar Planilha Excel (.csv) no Aparelho
                    </button>
                </div>
                <p id="status-envio" class="text-xs text-center font-semibold text-gray-600 hidden"></p>
            </div>
        </div>

    </div>

    <script>
        const EMAILJS_PUBLIC_KEY = "dO0wI6pOJV9s518uu";
        const EMAILJS_SERVICE_ID = "service_f8n7him";
        const EMAILJS_TEMPLATE_ID = "template_mppjgke";

        (function() {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        })();

        let itensContados = {};
        let html5QrCode = null;
        let itemAtual = null;

        const DADOS_EMPRESA = {
            cnpj: "20.948.559/0001-55",
            nome: "Grupo Brava Construcao e Incorporacao",
            razaoSocial: "Mda Construcoes LTDA"
        };

        function tocarBip() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Áudio indisponível:", e);
            }
        }

        function processarQRCode(rawText) {
            let codigo = rawText;
            let descricao = "Item sem Descrição";
            let unidade = "UN";
            try {
                let dados = JSON.parse(rawText);
                codigo = dados.codigo || rawText;
                descricao = dados.descricao || descricao;
                unidade = dados.unidade || unidade;
            } catch (e) {
                if (rawText.includes(',')) {
                    let partes = rawText.split(',');
                    codigo = partes[0].trim();
                    descricao = partes[1].trim();
                    if (partes[2]) unidade = partes[2].trim();
                }
            }
            return { codigo, descricao, unidade };
        }

        function onScanSuccess(decodedText) {
            tocarBip();
            if (html5QrCode) html5QrCode.pause();
            itemAtual = processarQRCode(decodedText);
            document.getElementById('modal-codigo').innerText = itemAtual.codigo;
            document.getElementById('modal-desc').innerText = itemAtual.descricao;
            document.getElementById('input-qtd').value = 1;
            
            let modal = document.getElementById('modal-qtd');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function salvarContagem() {
            let qtdInput = parseFloat(document.getElementById('input-qtd').value);
            let qtd = isNaN(qtdInput) || qtdInput < 0 ? 1 : qtdInput;

            if (itensContados[itemAtual.codigo]) {
                itensContados[itemAtual.codigo].quantidade += qtd;
            } else {
                itensContados[itemAtual.codigo] = { 
                    descricao: itemAtual.descricao, 
                    unidade: itemAtual.unidade,
                    quantidade: qtd 
                };
            }
            atualizarListaInterface();
            fecharModal();
        }

        function cancelarLeitura() {
            fecharModal();
        }

        function fecharModal() {
            let modal = document.getElementById('modal-qtd');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            itemAtual = null;
            if (html5QrCode) html5QrCode.resume();
        }

        function atualizarListaInterface() {
            let container = document.getElementById('lista-produtos');
            let total = 0;
            container.innerHTML = '';

            Object.keys(itensContados).forEach((codigo, index) => {
                let item = itensContados[codigo];
                total++;
                let div = document.createElement('div');
                div.className = 'py-2 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-800">${index + 1}. ${item.descricao}</p>
                        <p class="text-xs text-gray-500">Cód: ${codigo} | Un: ${item.unidade}</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full text-xs">Qtd: ${item.quantidade}</span>
                `;
                container.appendChild(div);
            });
            document.getElementById('total-itens').innerText = total;
        }

        function gerarConteudoExcelCSV() {
            let chaves = Object.keys(itensContados);
            let csvContent = "\uFEFF";
            
            csvContent += `EMPRESA:;${DADOS_EMPRESA.nome}\n`;
            csvContent += `RAZAO SOCIAL:;${DADOS_EMPRESA.razaoSocial}\n`;
            csvContent += `CNPJ:;${DADOS_EMPRESA.cnpj}\n`;
            csvContent += `DATA/HORA:;${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR')}\n\n`;
            
            csvContent += `Item;Código do Produto;Descrição;Unidade de Medida;Contagem\n`;
            
            chaves.forEach((codigo, index) => {
                let item = itensContados[codigo];
                let descLimpa = item.descricao.replace(/;/g, ',');
                csvContent += `${index + 1};${codigo};${descLimpa};${item.unidade};${item.quantidade}\n`;
            });

            return csvContent;
        }

        function baixarExcelLocal() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) {
                alert('Nenhum produto cadastrado para exportar!');
                return;
            }

            let csvContent = gerarConteudoExcelCSV();
            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Inventario_Contagem_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function enviarRelatorioServidor() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) {
                alert('Nenhum produto cadastrado para enviar!');
                return;
            }

            let destinatarios = [];
            if (document.getElementById('chk-corp').checked) {
                let email = document.getElementById('email-corp').value.trim();
                if (email) destinatarios.push(email);
            }
            if (document.getElementById('chk-celular').checked) {
                let email = document.getElementById('email-celular').value.trim();
                if (email) destinatarios.push(email);
            }
            if (document.getElementById('chk-pc').checked) {
                let email = document.getElementById('email-pc').value.trim();
                if (email) destinatarios.push(email);
            }
            let outroEmail = document.getElementById('input-outro-email').value.trim();
            if (outroEmail !== '') {
                destinatarios.push(outroEmail);
            }

            if (destinatarios.length === 0) {
                alert('Por favor, selecione e preencha ao menos um e-mail válido!');
                return;
            }

            let btn = document.getElementById('btn-envio');
            let status = document.getElementById('status-envio');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ Formatando e enviando relatório...";
            status.classList.remove('hidden');

            let relatorioTexto = `RELATÓRIO DE CONTAGEM DE ESTOQUE\n`;
            relatorioTexto += `Empresa: ${DADOS_EMPRESA.nome}\n`;
            relatorioTexto += `CNPJ: ${DADOS_EMPRESA.cnpj}\n`;
            relatorioTexto += `Data: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}\n\n`;
            relatorioTexto += `-------------------------------------------------------------------------\n`;
            relatorioTexto += `Item | Código do Produto | Descrição                    | Unid | Contagem\n`;
            relatorioTexto += `-------------------------------------------------------------------------\n`;
            
            chaves.forEach((codigo, index) => {
                let item = itensContados[codigo];
                let itNum = String(index + 1).padEnd(4, ' ');
                let codPadded = String(codigo).padEnd(17, ' ');
                let descPadded = item.descricao.substring(0, 28).padEnd(28, ' ');
                let unidPadded = String(item.unidade).padEnd(4, ' ');
                relatorioTexto += `${itNum} | ${codPadded} | ${descPadded} | ${unidPadded} | ${item.quantidade}\n`;
            });
            relatorioTexto += `-------------------------------------------------------------------------\n`;

            let templateParams = {
                to_email: destinatarios.join(', '),
                subject: `Contagem de Estoque - ${DADOS_EMPRESA.nome}`,
                message: relatorioTexto
            };

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                status.innerText = "✅ E-mail enviado com sucesso!";
                status.classList.remove('text-red-600');
                status.classList.add('text-green-600');
            } catch (error) {
                console.error("Erro no envio:", error);
                status.innerText = "❌ Erro ao enviar e-mail. Verifique a conexão.";
                status.classList.remove('text-green-600');
                status.classList.add('text-red-600');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        async function iniciarCameraTraseira() {
            try {
                if (html5QrCode) {
                    try { await html5QrCode.stop(); } catch(e){}
                    await html5QrCode.clear();
                }
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 220, height: 220 } };
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
            } catch (err) {
                alert("Erro ao acessar a câmera.");
            }
        }

        window.addEventListener('load', () => { iniciarCameraTraseira(); });
    </script>
</body>
</html>
