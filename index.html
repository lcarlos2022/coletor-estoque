<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletor de Estoque - Grupo Brava</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leitor QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Biblioteca SheetJS para Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 240px !important;
            border-radius: 0.5rem;
        }
        #reader__dashboard_section_csr button, #reader__dashboard_section_swaplink {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12 font-sans">

    <!-- Cabeçalho -->
    <div class="bg-blue-700 text-white p-4 shadow-md text-center">
        <h1 class="text-lg font-bold">Grupo Brava</h1>
        <p class="text-xs text-blue-200 mt-0.5">RELATÓRIO CONTAGEM DE ESTOQUE</p>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Câmera e Scanner -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
            <h2 class="font-semibold text-gray-700 text-sm mb-2">Escanear QR Code do Produto</h2>
            <div id="reader" class="w-full rounded-lg overflow-hidden border bg-black h-[240px] relative"></div>
            <div class="flex gap-2 mt-3">
                <button id="btn-iniciar" onclick="iniciarCameraTraseira()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow-sm">
                    🔄 Reiniciar / Alternar Câmera
                </button>
            </div>
        </div>

        <!-- Modal Quantidades -->
        <div id="modal-qtd" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Contagem de Estoque</h3>
                <div class="text-left bg-gray-50 p-3 rounded-lg text-sm space-y-1 border border-gray-200">
                    <p class="text-xs"><strong>Código:</strong> <span id="modal-codigo" class="text-blue-600 font-mono"></span></p>
                    <p class="text-xs"><strong>Descrição:</strong> <span id="modal-desc" class="text-gray-700 font-semibold"></span></p>
                </div>
                <div class="space-y-2 text-left">
                    <div>
                        <label class="block text-[10px] font-bold text-blue-600 uppercase mb-1">1ª Contagem</label>
                        <input type="number" id="input-qtd1" value="1" min="0" step="any" class="w-full text-center text-xl font-bold border-2 border-blue-400 rounded-lg p-1.5 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-green-600 uppercase mb-1">2ª Contagem</label>
                        <input type="number" id="input-qtd2" value="0" min="0" step="any" class="w-full text-center text-xl font-bold border-2 border-green-400 rounded-lg p-1.5 focus:outline-none">
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="cancelarLeitura()" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold text-sm">Cancelar</button>
                    <button onclick="salvarContagem()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold text-sm shadow-sm">Registrar</button>
                </div>
            </div>
        </div>

        <!-- Relatório Visual na Tela -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-700 text-sm">Relatório na Tela (<span id="total-itens">0</span> itens)</h2>
                <button onclick="limparLista()" class="text-[10px] text-red-500 hover:underline font-semibold">Limpar Tudo</button>
            </div>
            
            <div class="max-h-64 overflow-y-auto space-y-2.5 pr-1" id="lista-produtos">
                <p class="text-gray-400 text-center py-6 text-xs">Nenhum item escaneado ainda.</p>
            </div>

            <!-- Destinatários de E-mail Editáveis -->
            <div class="pt-3 border-t space-y-3">
                <p class="text-xs font-bold text-gray-500 uppercase">Enviar Relatório Para:</p>
                
                <div class="bg-gray-50 p-3 rounded-lg space-y-3 border border-gray-200">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <input type="checkbox" id="chk-corp" checked class="w-4 h-4 text-blue-600 rounded">
                            <label for="chk-corp" class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">E-mail Corporativo</label>
                        </div>
                        <input type="email" id="email-corp" value="luiz.oliveira@brava.com.br" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:outline-none font-medium text-gray-800">
                    </div>
                    <hr class="border-gray-200">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <input type="checkbox" id="chk-celular" checked class="w-4 h-4 text-green-600 rounded">
                            <label for="chk-celular" class="text-[10px] font-bold text-green-600 uppercase tracking-wider">E-mail Celular (Gmail)</label>
                        </div>
                        <input type="email" id="email-celular" value="ocluiz2021@gmail.com" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:outline-none font-medium text-gray-800">
                    </div>
                    <hr class="border-gray-200">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <input type="checkbox" id="chk-pc" checked class="w-4 h-4 text-purple-600 rounded">
                            <label for="chk-pc" class="text-[10px] font-bold text-purple-600 uppercase tracking-wider">E-mail PC / Notebook (Hotmail)</label>
                        </div>
                        <input type="email" id="email-pc" value="ocluiz@hotmail.com" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:outline-none font-medium text-gray-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-500 mb-1">Outro e-mail adicional (opcional):</label>
                    <input type="email" id="input-outro-email" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:outline-none" placeholder="exemplo@email.com">
                </div>

                <!-- Botões de Ação -->
                <div class="space-y-2">
                    <button id="btn-envio" onclick="enviarRelatorioServidor()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg text-xs font-bold shadow-sm flex items-center justify-center gap-2">
                        📊 Enviar Relatório & Baixar Planilha Excel
                    </button>
                    <button onclick="baixarExcelLocal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow-sm flex items-center justify-center gap-2">
                        📥 Baixar Planilha Excel (.xlsx) Avulsa
                    </button>
                </div>
                <p id="status-envio" class="text-xs text-center font-semibold text-gray-600 hidden"></p>
            </div>
        </div>

    </div>

    <script>
        const EMAILJS_PUBLIC_KEY = "dO0wI6pOJV9s518uu";
        const EMAILJS_SERVICE_ID = "service_f8n7him";
        const EMAILJS_TEMPLATE_ID = "template_mppjgke";

        (function() {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        })();

        let itensContados = {};
        let html5QrCode = null;
        let itemAtual = null;

        const DADOS_EMPRESA = {
            cnpj: "20.948.559/0001-55",
            nome: "Grupo Brava Construcao e Incorporacao"
        };

        function tocarBip() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Áudio indisponível:", e);
            }
        }

        function processarQRCode(rawText) {
            let textoLimpo = rawText.replace(/[\u0000-\u001F\u007F-\u009F]/g, "").trim();
            let codigo = textoLimpo;
            let descricao = "";
            let unidade = "UN";
            
            // 1. Tentar ler como JSON estruturado
            try {
                let dados = JSON.parse(textoLimpo);
                codigo = String(dados.codigo || dados.cod || dados.id || codigo).trim();
                descricao = String(dados.descricao || dados.desc || dados.produto || dados.nome || "").trim();
                unidade = String(dados.unidade || dados.un || unidade).trim();
                if (codigo && descricao) {
                    return { codigo, descricao, unidade };
                }
            } catch (e) {}

            // 2. Tentar ler separadores comuns (; , | tab)
            let separadores = [';', '|', '\t', ','];
            let sepUsado = null;
            for (let s of separadores) {
                if (textoLimpo.includes(s)) {
                    sepUsado = s;
                    break;
                }
            }

            if (sepUsado) {
                let partes = textoLimpo.split(sepUsado).map(p => p.trim()).filter(p => p.length > 0);
                if (partes.length >= 2) {
                    codigo = partes[0];
                    descricao = partes[1];
                    if (partes.length >= 3 && partes[2].length <= 5) {
                        unidade = partes[2];
                    }
                } else if (partes.length === 1) {
                    codigo = partes[0];
                }
            }

            // Se não encontrou descrição clara, define padrão limpo separado
            if (!descricao) {
                descricao = "Produto Cadastrado";
            }

            return { codigo, descricao, unidade };
        }

        function onScanSuccess(decodedText) {
            tocarBip();
            if (html5QrCode) html5QrCode.pause();
            itemAtual = processarQRCode(decodedText);
            document.getElementById('modal-codigo').innerText = itemAtual.codigo;
            document.getElementById('modal-desc').innerText = itemAtual.descricao;
            document.getElementById('input-qtd1').value = 1;
            document.getElementById('input-qtd2').value = 0;
            
            let modal = document.getElementById('modal-qtd');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function salvarContagem() {
            let qtd1 = parseFloat(document.getElementById('input-qtd1').value) || 0;
            let qtd2 = parseFloat(document.getElementById('input-qtd2').value) || 0;

            if (itensContados[itemAtual.codigo]) {
                itensContados[itemAtual.codigo].contagem1 += qtd1;
                itensContados[itemAtual.codigo].contagem2 += qtd2;
                if (itemAtual.descricao && itemAtual.descricao !== "Produto Cadastrado") {
                    itensContados[itemAtual.codigo].descricao = itemAtual.descricao;
                }
                if (itemAtual.unidade) {
                    itensContados[itemAtual.codigo].unidade = itemAtual.unidade;
                }
            } else {
                itensContados[itemAtual.codigo] = { 
                    descricao: itemAtual.descricao, 
                    unidade: itemAtual.unidade,
                    contagem1: qtd1,
                    contagem2: qtd2
                };
            }
            atualizarListaInterface();
            fecharModal();
        }

        function cancelarLeitura() {
            fecharModal();
        }

        function fecharModal() {
            let modal = document.getElementById('modal-qtd');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            itemAtual = null;
            if (html5QrCode) html5QrCode.resume();
        }

        function limparLista() {
            if (confirm("Deseja limpar todos os itens contados?")) {
                itensContados = {};
                atualizarListaInterface();
            }
        }

        function atualizarListaInterface() {
            let container = document.getElementById('lista-produtos');
            let chaves = Object.keys(itensContados);
            let total = chaves.length;
            container.innerHTML = '';

            if (total === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-6 text-xs">Nenhum item escaneado ainda.</p>';
                document.getElementById('total-itens').innerText = 0;
                return;
            }

            chaves.forEach((codigo, index) => {
                let item = itensContados[codigo];
                let diferenca = item.contagem2 - item.contagem1;
                let corDif = diferenca === 0 ? 'text-gray-700 bg-gray-100' : (diferenca > 0 ? 'text-green-700 bg-green-50 font-bold' : 'text-red-700 bg-red-50 font-bold');
                
                let card = document.createElement('div');
                card.className = 'bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-xs space-y-1.5 shadow-2xs';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-gray-800">${index + 1}. ${item.descricao}</span>
                        <span class="text-[10px] text-gray-500 font-mono">Un: ${item.unidade}</span>
                    </div>
                    <div class="text-[10px] text-blue-600 font-mono font-semibold">Cód: ${codigo}</div>
                    <div class="flex justify-between items-center pt-1 border-t border-gray-200 text-center">
                        <span class="bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">1ª: ${item.contagem1}</span>
                        <span class="bg-green-100 text-green-800 font-bold px-2 py-0.5 rounded">2ª: ${item.contagem2}</span>
                        <span class="px-2 py-0.5 rounded ${corDif}">Dif: ${diferenca}</span>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('total-itens').innerText = total;
        }

        function gerarWorkbookExcel() {
            let dadosLinhas = [
                ["GRUPO BRAVA CONSTRUCAO E INCORPORACAO"],
                ["CNPJ: " + DADOS_EMPRESA.cnpj],
                ["RELATÓRIO CONTAGEM DE ESTOQUE"],
                ["Data/Hora: " + new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR')],
                [],
                ["Item", "Código do Produto", "Descrição", "Unidade", "1ª Contagem", "2ª Contagem", "Diferença"]
            ];

            let chaves = Object.keys(itensContados);
            chaves.forEach((codigo, index) => {
                let item = itensContados[codigo];
                let rowNum = index + 7;
                dadosLinhas.push([
                    index + 1,
                    codigo,
                    item.descricao,
                    item.unidade,
                    item.contagem1,
                    item.contagem2,
                    { t: 'n', f: `F${rowNum}-E${rowNum}`, v: (item.contagem2 - item.contagem1) }
                ]);
            });

            let ws = XLSX.utils.aoa_to_sheet(dadosLinhas);
            
            ws['!cols'] = [
                {wch: 6},  
                {wch: 22}, 
                {wch: 35}, 
                {wch: 10}, 
                {wch: 15}, 
                {wch: 15}, 
                {wch: 15}  
            ];

            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Contagem de Estoque");
            return { wb, chaves };
        }

        function baixarExcelLocal() {
            let { chaves } = gerarWorkbookExcel();
            if (chaves.length === 0) {
                alert('Nenhum produto cadastrado para exportar!');
                return;
            }
            let { wb } = gerarWorkbookExcel();
            XLSX.writeFile(wb, `Relatorio_Contagem_Estoque_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        async function enviarRelatorioServidor() {
            let chaves = Object.keys(itensContados);
            if (chaves.length === 0) {
                alert('Nenhum produto cadastrado para enviar!');
                return;
            }

            let destinatarios = [];
            if (document.getElementById('chk-corp').checked) {
                let email = document.getElementById('email-corp').value.trim();
                if (email) destinatarios.push(email);
            }
            if (document.getElementById('chk-celular').checked) {
                let email = document.getElementById('email-celular').value.trim();
                if (email) destinatarios.push(email);
            }
            if (document.getElementById('chk-pc').checked) {
                let email = document.getElementById('email-pc').value.trim();
                if (email) destinatarios.push(email);
            }
            let outroEmail = document.getElementById('input-outro-email').value.trim();
            if (outroEmail !== '') {
                destinatarios.push(outroEmail);
            }

            if (destinatarios.length === 0) {
                alert('Por favor, selecione e preencha ao menos um e-mail válido!');
                return;
            }

            let btn = document.getElementById('btn-envio');
            let status = document.getElementById('status-envio');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "⏳ Enviando e-mail e baixando planilha Excel (.xlsx)...";
            status.classList.remove('hidden');

            let htmlTabela = `
                <div style="font-family: Arial, sans-serif; color: #333; max-width: 700px; margin: 0 auto; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px;">
                    <h2 style="color: #1F4E78; border-bottom: 2px solid #1F4E78; padding-bottom: 8px; margin-top: 0;">RELATÓRIO CONTAGEM DE ESTOQUE</h2>
                    <p style="margin: 5px 0;"><strong>Empresa:</strong> ${DADOS_EMPRESA.nome}</p>
                    <p style="margin: 5px 0;"><strong>CNPJ:</strong> ${DADOS_EMPRESA.cnpj}</p>
                    <p style="margin: 5px 0;"><strong>Data/Hora:</strong> ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}</p>
                    <p style="margin: 5px 0 15px 0;"><strong>Total de Itens:</strong> ${chaves.length}</p>
                    
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px;">
                        <thead>
                            <tr style="background-color: #1F4E78; color: white;">
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Item</th>
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Código</th>
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: left;">Descrição</th>
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Unid</th>
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">1ª Contagem</th>
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">2ª Contagem</th>
                                <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">Diferença</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            chaves.forEach((codigo, index) => {
                let item = itensContados[codigo];
                let dif = item.contagem2 - item.contagem1;
                let bgRow = index % 2 === 0 ? '#f8fafc' : '#ffffff';
                htmlTabela += `
                    <tr style="background-color: ${bgRow};">
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">${index + 1}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">${codigo}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: left;">${item.descricao}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center;">${item.unidade}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: bold; color: #2563eb;">${item.contagem1}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: bold; color: #16a34a;">${item.contagem2}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: bold;">${dif}</td>
                    </tr>
                `;
            });

            htmlTabela += `
                        </tbody>
                    </table>
                    <br>
                    <p style="font-size: 11px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 8px;">Relatório gerado automaticamente pelo sistema do Grupo Brava.</p>
                </div>
            `;

            let templateParams = {
                to_email: destinatarios.join(', '),
                subject: `Relatório Contagem de Estoque - ${DADOS_EMPRESA.nome} (${chaves.length} itens)`,
                message: htmlTabela
            };

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                baixarExcelLocal();

                status.innerText = "✅ E-mail enviado e arquivo Excel (.xlsx) baixado com sucesso!";
                status.classList.remove('text-red-600');
                status.classList.add('text-green-600');
            } catch (error) {
                console.error("Erro no envio:", error);
                status.innerText = "❌ Erro ao enviar e-mail. Verifique a conexão.";
                status.classList.remove('text-green-600');
                status.classList.add('text-red-600');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        async function iniciarCameraTraseira() {
            try {
                if (html5QrCode) {
                    try { await html5QrCode.stop(); } catch(e){}
                    await html5QrCode.clear();
                }
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 220, height: 220 } };
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
            } catch (err) {
                alert("Erro ao acessar a câmera.");
            }
        }

        window.addEventListener('load', () => { iniciarCameraTraseira(); });
    </script>
</body>
</html>
