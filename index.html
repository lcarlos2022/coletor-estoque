<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sienge Scanner Pro - Versão 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-blue-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Container Principal -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">

        <!-- ================= TELA 1: APRESENTAÇÃO (ÍCONE E NOME) ================= -->
        <div id="view-splash" class="view-section text-center py-8">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-600 text-white rounded-3xl shadow-lg mb-6 text-4xl">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Sienge Scanner Pro</h1>
            <p class="text-slate-500 mb-8">Controle de Almoxarifado e Coleta Óptica</p>
            
            <div class="space-y-3">
                <button onclick="mudarTela('view-login')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition">
                    Entrar no Sistema
                </button>
                <button onclick="mudarTela('view-register')" class="w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold py-3 px-4 rounded-xl shadow-sm transition">
                    Criar Novo Cadastro
                </button>
            </div>
        </div>

        <!-- ================= TELA 2: CADASTRO ================= -->
        <div id="view-register" class="view-section hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center mb-6">
                <button type="button" onclick="mudarTela('view-splash')" class="text-slate-400 hover:text-slate-600 mr-3 p-1">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-900">Criar Cadastro</h2>
            </div>
            <form onsubmit="realizarCadastro(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nome Completo</label>
                    <input type="text" id="reg-nome" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">E-mail Corporativo</label>
                    <input type="email" id="reg-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Senha</label>
                    <input type="password" id="reg-senha" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition">
                    Cadastrar e Continuar
                </button>
            </form>
        </div>

        <!-- ================= TELA 3: LOGIN ================= -->
        <div id="view-login" class="view-section hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center mb-6">
                <button type="button" onclick="mudarTela('view-splash')" class="text-slate-400 hover:text-slate-600 mr-3 p-1">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-900">Acessar Sistema</h2>
            </div>
            <form onsubmit="realizarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">E-mail Corporativo</label>
                    <input type="email" id="login-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Senha</label>
                    <input type="password" id="login-senha" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition">
                    Entrar
                </button>
            </form>
        </div>

        <!-- ================= TELA 4: TELA DE TRABALHO (LEITOR ÓPTICO) ================= -->
        <div id="view-work" class="view-section hidden flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center font-bold">
                        <i class="fa-solid fa-barcode"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-slate-900">Sienge Coleta</h2>
                        <span id="user-display" class="text-xs text-slate-500">Operador</span>
                    </div>
                </div>
                <button onclick="mudarTela('view-splash')" class="text-slate-400 hover:text-red-600 p-2" title="Sair do Sistema">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>

            <!-- Área do Leitor Óptico / Câmera Simulada -->
            <div class="bg-slate-900 rounded-2xl p-4 text-center text-white flex-grow flex flex-col justify-between shadow-inner relative overflow-hidden min-h-[250px]">
                <div class="absolute inset-0 border-2 border-dashed border-blue-500/50 m-4 rounded-xl pointer-events-none flex items-center justify-center">
                    <div class="w-3/4 h-0.5 bg-red-500 animate-pulse"></div>
                </div>
                <div class="z-10 pt-2">
                    <span class="bg-slate-800/80 text-xs px-3 py-1 rounded-full text-slate-300">Câmera Ativa</span>
                </div>
                <div class="z-10 pb-2">
                    <p class="text-xs text-slate-400 mb-2">Aponte para o código de barras ou QR Code</p>
                    <button onclick="simularLeitura()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded-lg shadow">
                        Simular Leitura Óptica
                    </button>
                </div>
            </div>

            <!-- Lista de Coletas Recentes -->
            <div class="mt-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold uppercase text-slate-500">Itens Lidos</h3>
                    <span id="contador-itens" class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600">0 itens</span>
                </div>
                <div id="lista-itens" class="space-y-2 max-h-36 overflow-y-auto text-xs">
                    <p class="text-slate-400 text-center py-4">Nenhum item coletado ainda.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Rodapé Simples -->
    <footer class="text-center py-3 text-xs text-slate-400">
        Sienge Scanner Pro &copy; 2026
    </footer>

    <!-- Script de Controle das Telas -->
    <script>
        let itensColetados = [];

        function mudarTela(idTela) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(idTela).classList.remove('hidden');
        }

        function realizarCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const senha = document.getElementById('reg-senha').value;

            localStorage.setItem('sienge_user_nome', nome);
            localStorage.setItem('sienge_user_email', email);
            localStorage.setItem('sienge_user_senha', senha);

            alert('Cadastro realizado com sucesso! Faça seu login.');
            document.getElementById('login-email').value = email;
            mudarTela('view-login');
        }

        function realizarLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value;
            const senhaInput = document.getElementById('login-senha').value;

            const salvoEmail = localStorage.getItem('sienge_user_email');
            const salvoSenha = localStorage.getItem('sienge_user_senha');
            const salvoNome = localStorage.getItem('sienge_user_nome') || 'Operador';

            if ((salvoEmail && emailInput === salvoEmail && senhaInput === salvoSenha) || !salvoEmail) {
                document.getElementById('user-display').innerText = salvoNome;
                mudarTela('view-work');
            } else {
                alert('E-mail ou senha incorretos.');
            }
        }

        function simularLeitura() {
            const codigoExemplo = 'SKU-' + Math.floor(100000 + Math.random() * 900000);
            itensColetados.unshift({ codigo: codigoExemplo, hora: new Date().toLocaleTimeString() });
            atualizarListaItens();
        }

        function atualizarListaItens() {
            const container = document.getElementById('lista-itens');
            document.getElementById('contador-itens').innerText = `${itensColetados.length} itens`;
            
            if (itensColetados.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-4">Nenhum item coletado ainda.</p>';
                return;
            }

            container.innerHTML = itensColetados.map(item => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
                    <span class="font-mono font-bold text-slate-700">${item.codigo}</span>
                    <span class="text-slate-400">${item.hora}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
